{% extends "base.html" %}
{% block title %}Log In — Lost and Found Application{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to report items, view matches and track claims.</p>
    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <hr class="divider">
    <p class="text-center muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
